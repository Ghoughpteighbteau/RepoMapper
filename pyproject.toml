[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repomapper"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "diskcache>=5.6.0",
    "fastmcp>=2.11.3",
    "grep-ast>=0.3.0",
    "networkx>=3.0",
    "numpy>=2.0",
    "pathspec>=0.12",
    "pygments>=2.14.0",
    "scipy>=1.13",
    "tiktoken>=0.5.0",
    "tree-sitter>=0.25.0",
]

[project.scripts]
repomap = "repomapper.repomap:main"
repomap-mcp = "repomapper.repomap_server:main"

[tool.setuptools]
packages = ["repomapper"]

[tool.setuptools.package-data]
repomapper = ["queries/**/*.scm"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
python_files = ["*_test.py"]
